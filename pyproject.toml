[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winding-audit"
version = "0.1.1"
description = "Check traced surfaces and per-winding segment sets against the published Lasagna winding fields and the CT of the Vesuvius Challenge open data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "numcodecs>=0.12",
  "tifffile>=2023.7",
  "imagecodecs>=2024.1",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
potential = ["pyamg>=5.0"]

[project.scripts]
winding-audit = "winding_audit.__main__:main"

[tool.setuptools]
packages = ["winding_audit"]
